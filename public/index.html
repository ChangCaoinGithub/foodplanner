<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Food Planner</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1f2a24;--muted:#6c7770;--line:#e2e4df;--accent:#406a52;--accent2:#e9f0eb;--danger:#9d4038}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1180px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}
h1{margin:0;font-size:34px;letter-spacing:-1px}.sub,.meta{color:var(--muted)}.meta{font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.tab,.storage-tab{background:#e8e8e3;color:#344139}
.tab.active,.storage-tab.active,.primary{background:var(--accent);color:#fff}
.ghost{background:var(--accent2);color:var(--accent)}.danger{background:#f7e9e7;color:var(--danger)}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 16px rgba(0,0,0,.035)}
.card h2{margin:0 0 14px;font-size:20px}
input,select,textarea{width:100%;border:1px solid #d9ddd8;border-radius:11px;padding:10px 11px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}
.search{margin-bottom:12px}
.ingredient{display:grid;grid-template-columns:1.8fr .8fr .8fr .9fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0ec}
.ingredient:last-child{border-bottom:0}.name{font-weight:650}.empty{padding:26px 8px;color:var(--muted);text-align:center}
.section{display:none}.section.active{display:block}
.selected{border:1px dashed #b7c3ba;border-radius:14px;padding:12px;margin-top:12px}
.selected-line{display:grid;grid-template-columns:1.5fr .7fr .7fr auto;gap:8px;align-items:center;margin-top:8px}
.meal{padding:13px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}.meal h3{margin:0 0 5px;font-size:17px}
.meal small{color:var(--muted)}.meal ul{margin:10px 0;padding-left:20px}.meal-actions{display:flex;gap:7px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#eff2ee;color:#5b665e;font-size:12px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.calendar-title{font-size:21px;font-weight:700}.calendar-nav{display:flex;gap:8px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.weekday{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:5px}
.day{min-height:120px;border:1px solid var(--line);border-radius:14px;padding:9px;background:white;cursor:pointer}
.day.other{opacity:.42}.day.today{outline:2px solid #9ab1a0}.day.selected{outline:2px solid var(--accent)}
.daynum{font-size:13px;font-weight:700;margin-bottom:7px}.calmeal{font-size:12px;background:var(--accent2);color:var(--accent);border-radius:8px;padding:5px 6px;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calmeal.eaten{background:#efefec;color:#69726c}.calendar-detail{margin-top:16px}.detail-meal{padding:11px 0;border-bottom:1px solid var(--line)}
.auth-card{max-width:440px;margin:70px auto}.auth-card h2{margin-top:0}.hidden{display:none!important}
.auth-message{margin-top:10px;font-size:13px;color:var(--muted)}.auth-message.error{color:var(--danger)}
.top-actions{display:flex;gap:8px;align-items:center}
@media(max-width:800px){
.grid{grid-template-columns:1fr}.ingredient,.selected-line,.formgrid{grid-template-columns:1fr 1fr}
.ingredient .name{grid-column:1/-1}header{align-items:start;flex-direction:column}.day{min-height:90px;padding:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="authGate" class="card auth-card hidden">
    <h2>Enter your email</h2>
    <div class="meta" style="margin-bottom:12px">Use one of the family emails that has access to this kitchen.</div>
    <input id="loginEmail" type="email" placeholder="your@email.com" autocomplete="email" />
    <button id="continueBtn" class="primary" style="margin-top:10px;width:100%">Continue</button>
    <div id="authMessage" class="auth-message"></div>
  </div>

  <div id="appShell" class="hidden">
    <header>
      <div>
        <h1>Food Planner</h1>
      </div>
      <div class="top-actions">
        <div class="tabs">
          <button class="tab active" data-tab="storage">Storage</button>
          <button class="tab" data-tab="planner">Meal planner</button>
          <button class="tab" data-tab="calendar">Calendar</button>
        </div>
        <button id="logoutBtn" class="ghost" title="Forget this device">Log out</button>
      </div>
    </header>

    <section id="storage" class="section active">
      <div class="grid">
        <div class="card">
          <h2>What do we have?</h2>
          <div class="tabs" style="margin-bottom:14px">
            <button class="storage-tab active" data-storage="Fridge">Fridge</button>
            <button class="storage-tab" data-storage="Freezer">Freezer</button>
            <button class="storage-tab" data-storage="Outside">Outside</button>
          </div>
          <input id="search" class="search" placeholder="Search ingredients…" />
          <div id="ingredientList"></div>
        </div>
        <div class="card">
          <h2>Add ingredient</h2>
          <div class="formgrid">
            <input id="newName" placeholder="e.g. Chicken breast" />
            <input id="newQty" type="number" min="0" step="0.1" placeholder="Amount" />
            <select id="newUnit"><option>kg</option><option>ml</option><option selected>portion</option><option>pieces</option></select>
          </div>
          <select id="newStorage" style="margin-top:9px"><option>Fridge</option><option>Freezer</option><option>Outside</option></select>
          <button id="addIngredient" class="primary" style="margin-top:11px;width:100%">Add ingredient</button>
        </div>
      </div>
    </section>

    <section id="planner" class="section">
      <div class="grid">
        <div class="card">
          <h2>Plan lunch or dinner</h2>
          <div class="formgrid">
            <input id="mealName" placeholder="Meal name, e.g. Chicken stir fry" />
            <select id="mealType"><option>Lunch</option><option>Dinner</option></select>
            <input id="mealDate" type="date" />
          </div>
          <textarea id="mealNotes" style="margin-top:9px" placeholder="Notes, seasoning, recipe idea…"></textarea>
          <div class="selected">
            <strong>Choose ingredients</strong>
            <div class="meta">Use food from the fridge, freezer or outside storage.</div>
            <div id="ingredientPicker"></div>
          </div>
          <button id="saveMeal" class="primary" style="margin-top:12px;width:100%">Save meal</button>
        </div>
        <div class="card"><h2>Planned meals</h2><div id="mealList"></div></div>
      </div>
    </section>

    <section id="calendar" class="section">
      <div class="card">
        <div class="calendar-head">
          <div><div class="calendar-title" id="calendarTitle"></div><div class="meta">Planned meals and meals already eaten.</div></div>
          <div class="calendar-nav">
            <button class="ghost" id="prevMonth">←</button>
            <button class="ghost" id="todayMonth">Today</button>
            <button class="ghost" id="nextMonth">→</button>
          </div>
        </div>
        <div class="calendar-grid" id="weekdayRow"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="card calendar-detail"><h2 id="selectedDateTitle">Select a day</h2><div id="selectedDateMeals"></div></div>
    </section>
  </div>
</div>

<script>
let ingredients=[], meals=[], activeStorage='Fridge';
let calendarCursor=new Date(); calendarCursor.setDate(1);
let selectedCalendarDate=new Date().toISOString().slice(0,10);
let pollTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

async function api(path, options={}){
  const res=await fetch('/api/'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
  let data={}; try{data=await res.json()}catch{}
  if(res.status===401){showAuth();throw new Error('Unauthorized')}
  if(!res.ok) throw new Error(data.error||'Request failed');
  return data;
}
function showAuth(){ $('#authGate').classList.remove('hidden'); $('#appShell').classList.add('hidden'); }
function showApp(){ $('#authGate').classList.add('hidden'); $('#appShell').classList.remove('hidden'); }
function setAuthMessage(msg,error=false){const el=$('#authMessage');el.textContent=msg;el.classList.toggle('error',error)}
async function checkSession(){
  try{await api('session');showApp();await loadAll();startPolling()}
  catch{showAuth()}
}
async function login(){
  const email=$('#loginEmail').value.trim().toLowerCase();
  if(!email)return setAuthMessage('Please enter your email.',true);
  $('#continueBtn').disabled=true;$('#continueBtn').textContent='Checking…';setAuthMessage('');
  try{
    await api('login',{method:'POST',body:JSON.stringify({email})});
    showApp();await loadAll();startPolling();
  }catch(e){
    setAuthMessage(e.message==='Too many attempts'?'Too many attempts. Please try again later.':'This email does not have access to this kitchen.',true);
  }finally{$('#continueBtn').disabled=false;$('#continueBtn').textContent='Continue'}
}
async function logout(){
  try{await api('logout',{method:'POST'})}catch{}
  stopPolling();showAuth();
}
async function loadAll(){
  const [a,b]=await Promise.all([api('ingredients'),api('meals')]);
  ingredients=a.ingredients||[];meals=b.meals||[];renderAll();
}
function startPolling(){
  stopPolling();
  pollTimer=setInterval(()=>{if(!document.hidden)loadAll().catch(()=>{})},10000);
}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#appShell').classList.contains('hidden'))loadAll().catch(()=>{})});

function renderIngredients(){
  const q=$('#search').value.toLowerCase();
  const list=ingredients.filter(x=>x.storage===activeStorage&&x.name.toLowerCase().includes(q));
  $('#ingredientList').innerHTML=list.length?list.map(x=>`
    <div class="ingredient">
      <div><div class="name">${esc(x.name)}</div></div>
      <input type="number" min="0" step="0.1" value="${x.quantity}" data-qty="${x.id}">
      <select data-unit="${x.id}">${['kg','ml','portion','pieces'].map(u=>`<option ${u===x.unit?'selected':''}>${u}</option>`).join('')}</select>
      <select data-storage="${x.id}">${['Fridge','Freezer','Outside'].map(s=>`<option ${s===x.storage?'selected':''}>${s}</option>`).join('')}</select>
    </div>`).join(''):`<div class="empty">Nothing stored here yet.</div>`;
  document.querySelectorAll('[data-qty]').forEach(el=>el.addEventListener('change',()=>updateQty(el.dataset.qty,el.value)));
  document.querySelectorAll('[data-unit]').forEach(el=>el.addEventListener('change',()=>updateIngredient(el.dataset.unit,{unit:el.value})));
  document.querySelectorAll('[data-storage]').forEach(el=>el.addEventListener('change',()=>updateIngredient(el.dataset.storage,{storage:el.value})));
}
function renderPicker(){
  $('#ingredientPicker').innerHTML=ingredients.length?ingredients.map(x=>`
    <div class="selected-line">
      <label><input type="checkbox" class="pick" data-id="${x.id}" style="width:auto"> ${esc(x.name)}
        <span class="meta">(${x.quantity} ${esc(x.unit)} · ${esc(x.storage)})</span></label>
      <input type="number" min="0" step="0.1" class="useQty" data-id="${x.id}" placeholder="Use">
      <span class="meta">${esc(x.unit)}</span><span></span>
    </div>`).join(''):`<div class="empty">Add some ingredients first.</div>`;
}
function renderMeals(){
  const planned=meals.filter(m=>m.status==='planned').sort((a,b)=>a.meal_date.localeCompare(b.meal_date));
  $('#mealList').innerHTML=planned.length?planned.map(m=>`
    <div class="meal">
      <h3>${esc(m.name)}</h3><small>${esc(m.meal_type)} · ${esc(m.meal_date)}</small>
      ${m.items?.length?`<ul>${m.items.map(i=>`<li>${esc(i.name)} — ${i.qty} ${esc(i.unit)}</li>`).join('')}</ul>`:''}
      ${m.notes?`<div class="meta" style="margin-bottom:10px">${esc(m.notes)}</div>`:''}
      <div class="meal-actions">
        <button class="primary" data-cook="${m.id}">Cooked ✓</button>
        <button class="ghost" data-delmeal="${m.id}">Delete plan</button>
      </div>
    </div>`).join(''):`<div class="empty">Nothing planned yet.</div>`;
  document.querySelectorAll('[data-cook]').forEach(b=>b.addEventListener('click',()=>cookMeal(b.dataset.cook)));
  document.querySelectorAll('[data-delmeal]').forEach(b=>b.addEventListener('click',()=>deleteMeal(b.dataset.delmeal)));
}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function mealsForDate(k){return meals.filter(m=>m.meal_date===k)}
function renderCalendar(){
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const weekdays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  $('#calendarTitle').textContent=`${months[calendarCursor.getMonth()]} ${calendarCursor.getFullYear()}`;
  $('#weekdayRow').innerHTML=weekdays.map(x=>`<div class="weekday">${x}</div>`).join('');
  const first=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1),start=new Date(first),dow=(first.getDay()+6)%7;
  start.setDate(first.getDate()-dow);const today=dateKey(new Date());let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=dateKey(d),dm=mealsForDate(key);
    const cls=['day',d.getMonth()!==calendarCursor.getMonth()?'other':'',key===today?'today':'',key===selectedCalendarDate?'selected':''].filter(Boolean).join(' ');
    cells+=`<div class="${cls}" data-day="${key}"><div class="daynum">${d.getDate()}</div>${dm.slice(0,3).map(m=>`<div class="calmeal ${m.status==='eaten'?'eaten':''}">${m.meal_type==='Lunch'?'☀️':'🌙'} ${esc(m.name)}${m.status==='eaten'?' ✓':''}</div>`).join('')}</div>`;
  }
  $('#calendarGrid').innerHTML=cells;
  document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>selectDay(el.dataset.day)));
  renderSelectedDay();
}
function renderSelectedDay(){
  const items=mealsForDate(selectedCalendarDate),d=new Date(selectedCalendarDate+'T12:00:00');
  $('#selectedDateTitle').textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  $('#selectedDateMeals').innerHTML=items.length?items.map(m=>`<div class="detail-meal"><strong>${m.meal_type==='Lunch'?'☀️ Lunch':'🌙 Dinner'} · ${esc(m.name)}</strong> <span class="pill">${m.status==='eaten'?'Eaten ✓':'Planned'}</span>${m.items?.length?`<div class="meta" style="margin-top:5px">${m.items.map(i=>`${esc(i.name)} (${i.qty} ${esc(i.unit)})`).join(' · ')}</div>`:''}${m.notes?`<div class="meta" style="margin-top:4px">${esc(m.notes)}</div>`:''}</div>`).join(''):`<div class="empty">No lunch or dinner recorded for this day.</div>`;
}
function renderAll(){renderIngredients();renderPicker();renderMeals();renderCalendar()}

async function addIngredient(){
  const name=$('#newName').value.trim(),quantity=Number($('#newQty').value);
  if(!name||!(quantity>0))return alert('Please enter an ingredient and amount.');
  await api('ingredients',{method:'POST',body:JSON.stringify({name,quantity,unit:$('#newUnit').value,storage:$('#newStorage').value})});
  activeStorage=$('#newStorage').value;document.querySelectorAll('.storage-tab').forEach(b=>b.classList.toggle('active',b.dataset.storage===activeStorage));
  $('#newName').value='';$('#newQty').value='';await loadAll();
}
async function updateQty(id,value){
  const quantity=Math.max(0,Number(value)||0);
  if(quantity===0)await api('ingredients?id='+encodeURIComponent(id),{method:'DELETE'});
  else await updateIngredient(id,{quantity});
  await loadAll();
}
async function updateIngredient(id,patch){
  await api('ingredients?id='+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(patch)});
}
async function saveMeal(){
  const name=$('#mealName').value.trim();if(!name)return alert('Please name the meal.');
  const items=[...document.querySelectorAll('.pick:checked')].map(c=>{const ing=ingredients.find(x=>x.id===c.dataset.id);const q=Number(document.querySelector(`.useQty[data-id="${c.dataset.id}"]`).value);return ing&&q>0?{ingredientId:ing.id,name:ing.name,qty:q,unit:ing.unit}:null}).filter(Boolean);
  await api('meals',{method:'POST',body:JSON.stringify({name,meal_type:$('#mealType').value,meal_date:$('#mealDate').value,notes:$('#mealNotes').value.trim(),items})});
  $('#mealName').value='';$('#mealNotes').value='';await loadAll();
}
async function deleteMeal(id){if(confirm('Delete this planned meal?')){await api('meals?id='+encodeURIComponent(id),{method:'DELETE'});await loadAll()}}
async function cookMeal(id){await api('meals?id='+encodeURIComponent(id)+'&action=cook',{method:'PATCH'});await loadAll()}
function selectDay(key){selectedCalendarDate=key;const [y,m]=key.split('-').map(Number);calendarCursor=new Date(y,m-1,1);renderCalendar()}

$('#continueBtn').addEventListener('click',login);$('#loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#logoutBtn').addEventListener('click',logout);$('#addIngredient').addEventListener('click',addIngredient);$('#saveMeal').addEventListener('click',saveMeal);$('#search').addEventListener('input',renderIngredients);
document.querySelectorAll('.storage-tab').forEach(btn=>btn.addEventListener('click',()=>{activeStorage=btn.dataset.storage;document.querySelectorAll('.storage-tab').forEach(b=>b.classList.toggle('active',b===btn));renderIngredients()}));
$('#prevMonth').addEventListener('click',()=>{calendarCursor.setMonth(calendarCursor.getMonth()-1);renderCalendar()});
$('#nextMonth').addEventListener('click',()=>{calendarCursor.setMonth(calendarCursor.getMonth()+1);renderCalendar()});
$('#todayMonth').addEventListener('click',()=>{calendarCursor=new Date();calendarCursor.setDate(1);selectedCalendarDate=dateKey(new Date());renderCalendar()});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===btn.dataset.tab))}));
$('#mealDate').value=new Date().toISOString().slice(0,10);
checkSession();
</script>
</body>
</html>
